[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-assistant-moteur"
version = "0.1.0"
description = "Moteur de recherche de Portfolio Assistant : backtests sans regard vers l'avenir, essais comptés, test scellé unique, 12 tests de validation, atelier (frais réels, levier, découvert, mode algorithmique)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan Peronnier" }]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "yfinance>=0.2.54"]

[project.optional-dependencies]
rapport = ["matplotlib>=3.8", "reportlab>=4.2"]
tests = ["pytest>=8", "pypdf>=5.0", "matplotlib>=3.8", "reportlab>=4.2"]

[project.scripts]
portfolio-assistant = "portfolio_assistant.cli:main"

[tool.setuptools]
packages = ["portfolio_assistant", "portfolio_assistant.donnees"]

[tool.setuptools.package-data]
"portfolio_assistant.donnees" = ["*.csv"]
